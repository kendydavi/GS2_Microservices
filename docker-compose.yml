version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: solar-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: solar-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingest-service:
    build: ./src/ingest-service
    container_name: solar-ingest
    ports:
      - "8001:8001"
    environment:
      NASA_API_KEY: ${NASA_API_KEY:-DEMO_KEY}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SSL_VERIFY: ${SSL_VERIFY:-false}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  alert-service:
    build: ./src/alert-service
    container_name: solar-alert
    ports:
      - "8002:8002"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  nginx:
    image: nginx:1.25-alpine
    container_name: solar-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ingest-service
      - alert-service
    restart: on-failure
