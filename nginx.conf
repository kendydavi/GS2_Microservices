worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Rate limiting: 10 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream ingest_service {
        server ingest-service:8001;
    }

    upstream alert_service {
        server alert-service:8002;
    }

    server {
        listen 80;
        server_name _;

        location /api/ingest/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://ingest_service/ingest/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location /api/alerts {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://alert_service/alerts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/health/ingest {
            proxy_pass http://ingest_service/health;
        }

        location /api/health/alert {
            proxy_pass http://alert_service/health;
        }
    }
}
